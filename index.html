<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi App</title>

    <!-- PWA Meta tags -->
    <meta name="theme-color" content="#ec4899">
    <link rel="manifest" href="manifest.json">

    <!-- iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi App">
    <link rel="apple-touch-icon" href="icon.svg">

    <!-- Fonts: Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <h1 id="header-title">Inicio</h1>
    </header>

    <main class="app-content">
        <!-- Sections -->
        <section id="notificaciones" class="page-section active">
            <h2>Notificaciones</h2>
            <div id="notificaciones-list" class="list-container">
                <p class="empty-msg">No hay notificaciones recientes.</p>
            </div>
        </section>

        <section id="mantenimiento" class="page-section">
            <h2>Mantenimiento</h2>
            <form id="mantenimiento-form" class="app-form">
                <select id="mant-category" required>
                    <option value="" disabled selected>Categoría (Vehículo o Mascota)</option>
                    <option value="vehiculo">Vehículo (ITV, seguro, revisión)</option>
                    <option value="mascota">Mascota (Cita, vacuna)</option>
                </select>
                <input type="text" id="mant-name" placeholder="Nombre/Descripción (ej: Coche ITV)" required>
                <input type="date" id="mant-date" required>
                <button type="submit" class="btn-primary">Añadir Registro</button>
            </form>
            <div id="mantenimiento-list" class="list-container"></div>
        </section>

        <section id="agenda" class="page-section">
            <h2>Agenda</h2>
            <form id="agenda-form" class="app-form">
                <input type="text" id="agenda-title" placeholder="Título de la cita" required>
                <input type="date" id="agenda-date" required>
                <input type="time" id="agenda-time" required>
                <button type="submit" class="btn-primary">Crear Cita</button>
            </form>
            <div id="agenda-list" class="list-container"></div>
        </section>

        <section id="salud" class="page-section">
            <h2>Salud</h2>
            <div class="salud-actions">
                <label for="salud-upload" class="btn-primary btn-upload">
                    Adjuntar / Escanear Documento
                </label>
                <input type="file" id="salud-upload" accept="image/*" capture="environment" style="display: none;">
            </div>
            <div id="salud-gallery" class="gallery-container"></div>
        </section>

        <section id="ajustes" class="page-section">
            <h2>Ajustes</h2>

            <div class="settings-group">
                <h3>Perfil y Cuenta</h3>
                <div class="form-group">
                    <label for="profile-name">Nombre / Apodo</label>
                    <input type="text" id="profile-name" placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label for="profile-phone">Teléfono de Emergencia</label>
                    <input type="tel" id="profile-phone" placeholder="Ej: +34 600 000 000">
                </div>
                <div class="form-group">
                    <label for="profile-notes">Notas Personales</label>
                    <textarea id="profile-notes" placeholder="Alergias, tipo de sangre, etc." rows="3"></textarea>
                </div>
                <button id="save-profile" class="btn-primary">Guardar Perfil</button>
            </div>

            <div class="settings-group">
                <h3>Seguridad y Face ID</h3>
                <div class="setting-item">
                    <span>Bloqueo con Face ID / Biometría</span>
                    <label class="switch">
                        <input type="checkbox" id="biometric-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                <button id="access-sensitive-data" class="btn-secondary mt-2">Acceder a Documentos Sensibles</button>
                <p id="auth-status" class="status-msg"></p>
            </div>

            <div class="settings-group">
                <h3>Gestión de Datos</h3>
                <button id="export-data" class="btn-secondary">Exportar Datos (Backup)</button>

                <div class="import-wrapper">
                    <label for="import-data" class="btn-secondary" style="display: block; text-align: center;">Importar Datos</label>
                    <input type="file" id="import-data" accept=".json" style="display: none;">
                </div>

                <button id="delete-data" class="btn-danger mt-2">Borrar Todos los Datos</button>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-target="notificaciones">
            <span class="icon">🔔</span>
            <span class="label">Notificaciones</span>
        </button>
        <button class="nav-item" data-target="mantenimiento">
            <span class="icon">🛠️</span>
            <span class="label">Mantenimiento</span>
        </button>
        <button class="nav-item" data-target="agenda">
            <span class="icon">📅</span>
            <span class="label">Agenda</span>
        </button>
        <button class="nav-item" data-target="salud">
            <span class="icon">❤️</span>
            <span class="label">Salud</span>
        </button>
        <button class="nav-item" data-target="ajustes">
            <span class="icon">⚙️</span>
            <span class="label">Ajustes</span>
        </button>
    </nav>

    <!-- App Logic & Service Worker Registration -->
    <script src="app.js"></script>
</body>
</html>
